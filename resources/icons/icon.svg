<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
  <!-- B4RCS (#83): a 4 that also reads as an A. Its slanted stroke is the A's left leg, its upright the
       right leg and its crossbar the A's bar. Below the bar the leg is see-through, so the 4 stands out -->
  <rect width="160" height="160" rx="34" fill="#3d4a5c"/>
  <svg x="34" y="22" width="92" height="116" viewBox="0 0 100 120">
    <path d="M25 76 L8 112" fill="none" stroke="#e0a526" stroke-opacity="0.4" stroke-width="15" stroke-linecap="round"/>
    <path d="M58 6 L25 76" fill="none" stroke="#e0a526" stroke-width="15" stroke-linecap="round"/>
    <path d="M62 6 L62 114" fill="none" stroke="#e0a526" stroke-width="15" stroke-linecap="round"/>
    <path d="M24 76 L90 76" fill="none" stroke="#e0a526" stroke-width="13" stroke-linecap="round"/>
  </svg>
  <path transform="translate(123 29) scale(1.1)" d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="#f6e7c1"/>
</svg>
